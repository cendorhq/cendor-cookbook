# Cendor Cookbook — a uv-managed project of copy-paste recipes (not a published package).
# Recipes install the SHIPPED PyPI packages (cendor-libs 1.x), never local source, and every
# recipe runs offline with no API key. Framework SDKs live in per-category dependency-groups
# with upper bounds so one framework's breaking release can't turn the whole repo's CI red.
[project]
name = "cendor-cookbook"
version = "1.0.0"
description = "Copy-paste recipes proving Cendor works with real frameworks and providers — every recipe runs offline, no API key."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "cendor-libs>=1.0,<2.0",
  "cendor-sdk>=1.0,<2.0",          # the SDK recipes (recipes/sdk/) — pulls the same libs
  # 1.4 made tiktoken a hard dependency — exact token counts by default (the [tiktoken] extra is
  # gone; the floor must be >=1.4 so a resolve can't pick an older version that treats it as optional).
  # >=1.14.1 for the agents/ recipes: a replayed call on an **async** client is awaitable again, which
  # is what lets a whole aiohttp/express agent replay from a cassette with no app-side shim. Below
  # that floor `await client.chat.completions.create(...)` raises TypeError under a replay scope.
  # >=1.15.0 for the providers/ recipes: `cendor.core.prices.register_model_price(...)` is public on
  # the LIBRARIES door (before it, pricing a deployment needed the cendor-sdk distribution), and
  # `generate_content_stream` is captured, which is what the gemini recipe's streaming section shows.
  # >=1.17.0: Anthropic messages.stream()/parse() are captured (they emitted nothing at all
  # before), and a Reroute no longer ends the interceptor chain — which the combos/ recipes
  # depend on, since several install a budget and a guard on the same call and before 1.17.0
  # exactly one of them took effect, silently, depending on registration order.
  "cendor-core>=1.17.0,<2.0",
  # The guardrails recipes need the gate + its acttrace capture. >=1.2 for load_policy (the
  # guardrails-policy recipe); acttrace >=1.4 captures the decision `metadata` (policy_hash /
  # policy_version) into the chain. >=1.4 for rules.intent / custom_category (the intent-gate +
  # custom-category recipes). cendor-guardrails is the deterministic gate itself.
  "cendor-guardrails>=1.4,<2.0",
  "cendor-acttrace>=1.4,<2.0",
  # G4 — an EXPLICIT tokenguard floor. `cendor-libs` pulls it transitively, so a fresh resolve could
  # legally land on 1.6.1 and reproduce the post-flight BudgetExceeded message the bedrock recipe
  # exists to teach against ("spent $X > cap $None" for a TOKEN cap). >=1.6.3 also carries the pin
  # that `on_exceed="break"` cuts a **Gemini** stream (it could not, before core 1.15 captured one).
  "cendor-tokenguard>=1.6.3,<2.0",
]

[tool.uv]
package = false

[dependency-groups]
# Test/lint tooling shared by the testing/ and governance/ recipes and CI.
dev = [
  "pytest>=8,<10",
  "pytest-xdist>=3,<4",
  "pytest-asyncio>=0.24,<1.5",
  "ruff==0.16.0",
]
# Framework SDK groups — one per framework category so CI can install (and break) them in
# isolation. Each carries an upper bound at the next breaking release, so one framework's
# major/minor bump can turn its own job red without failing the rest of the repo's CI.
# (These are the versions resolved at authoring time; the weekly cron re-resolves within
# these bounds to catch drift.)
frameworks-langchain = [
  "langchain>=1.3,<2",
  "langchain-openai>=1.3,<2",
  "langgraph>=1.2,<2",
]
frameworks-agents = [
  "openai-agents>=0.17,<0.19",
]
# Framework-bridge recipes (recipes/bridges/): expose a cendor Guardrail inside another framework's
# own guardrail/hook seam. Offline — the recipes exercise the bridge directly, no model call.
frameworks-mcp = [
  "mcp>=1.28,<2",
]
frameworks-claude-agent = [
  "claude-agent-sdk>=0.2,<1",
]
frameworks-llamaindex = [
  "llama-index-core>=0.14,<0.15",
]
# Agent-host recipes (recipes/agents/): the agent runs inside somebody else's HOST process, so the
# host SDK itself is the dependency. Own group, own upper bound — the Microsoft 365 Agents SDK moves
# fast and a breaking release must turn only this cell red.
# Verified against the **M365 Agents Playground 0.2.28** on 2026-08-01: the agent starts, the
# Playground's conversationUpdate + message Activities are accepted (HTTP 202 — the Bot Framework
# protocol answers out-of-band on the connector, not in the response body), and the governed reply
# comes back. The floor is >=1.2 because that is where the hosting package's aiohttp entry point
# (`start_agent_process`) settled; the <2 ceiling keeps a breaking Microsoft release in this cell.
agents-m365 = [
  "microsoft-agents-hosting-aiohttp>=1.2,<2",
]
frameworks-otel = [
  "opentelemetry-sdk>=1.43,<2",
]
# Observability recipes (recipes/observability/): export Cendor's governance to an OTel backend.
# Offline — in-memory OTel readers stand in for a real collector/vendor distro.
observability-otel = [
  "opentelemetry-sdk>=1.43,<2",
]
# The chat-playground app (recipes/apps/chat-playground). Gradio is pinned with an upper bound
# so a Gradio breaking release turns only this group's CI cell red — never the recipes' jobs.
# Held at <6: gradio 6 moved theme/css to launch() and dropped Chatbot(type=), which app.py uses —
# migrating the app to gradio 6 is tracked separately.
# The provider SDKs are optional (live mode only); demo mode needs neither, and app.py imports
# them lazily so the group installs and imports fine without a key.
apps = [
  "gradio>=5,<6",
  "openai>=1.40,<3",
  "anthropic>=0.40,<1",
]
# G7 — the provider SDKs the recipes/providers/ RECORD=1 paths need. They used to be pulled ad hoc
# with `uv run --with …`, which works but is invisible to dependabot, so a CVE or a breaking release
# in either would never raise a PR here. Declared (with upper bounds, like the framework groups) so
# they are tracked; the OFFLINE path still imports none of them.
providers = [
  "google-genai>=1.0,<3",       # recipes/providers/gemini
  "boto3>=1.34,<2",             # recipes/providers/bedrock
  # `ollama` was the one provider SDK still pulled ad hoc with `uv run --with ollama`, which is
  # exactly the invisibility the two above were declared to fix — dependabot cannot raise a PR for
  # a dependency that appears in no manifest. It has no upper bound worth guessing yet (0.x, and
  # the recipe touches only `chat()`), so it carries the same shape of floor as the others.
  "ollama>=0.4,<1",             # recipes/providers/ollama-local (OLLAMA_LIVE=1)
]
# The Foundry SDK, for the azure-foundry recipe's `AIProjectClient -> get_openai_client()` variant.
# A *user's* dependency, never Cendor's — the point of the section is that the client it returns is
# a plain `openai.OpenAI`, so cendor needs no Foundry-specific code.
providers-foundry = [
  "azure-ai-projects>=2.3,<3",
  "azure-identity>=1.20,<2",
]

[tool.pytest.ini_options]
testpaths = ["recipes"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# ⚠️ Markdown is excluded DELIBERATELY, not to dodge a failure. Ruff 0.16 added `*.md` to its default
# `include`, so `ruff format` began reformatting the Python blocks inside every recipe README. Those
# blocks are prose typography, hand-set for reading, and three of the four rewrites it wanted made the
# teaching worse: it wrapped the `agent = Agent(...)` one-liner in `sdk/governed-agent` across three
# lines (the block whose entire point is "a governed agent in ~10 lines"), added an indentation level
# inside `otel.ingest({...})` in `observability/batch-ingest`, and collapsed a deliberately aligned
# inline comment. Ruff's job in this repo is the 95 Python files; the READMEs are edited by hand.
# This does NOT weaken anything: ruff never checked markdown before 0.16, so nothing is lost.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
