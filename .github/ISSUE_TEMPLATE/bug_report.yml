name: Bug report
description: A recipe does not run, or does not print what its README says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **This repo publishes nothing** — it is a set of copy-paste recipes, so
        a bug here is almost always *"a recipe does not run"* or *"the output does not match its
        README"*.

        > **Every recipe runs OFFLINE, with no API key and no network call to a model provider.** CI has
        > no secrets, by design. So if a recipe asks you for a key, or tries to reach a provider, that
        > is a **bug in the recipe** — not a prerequisite you are missing. Please file it.

        Routing:

        - **Security vulnerability?** Do not open a public issue — report it privately through
          [GitHub Private Vulnerability Reporting](https://github.com/cendorhq/cendor-cookbook/security/advisories/new)
          (details in [`SECURITY.md`](https://github.com/cendorhq/cendor-cookbook/blob/main/SECURITY.md)).
          A recipe that teaches an unsafe pattern, or a fixture with a leaked credential, counts.
        - **Is the flaw in a *library*, rather than in how the recipe drives it?** File it on
          [cendor-libs](https://github.com/cendorhq/cendor-libs/issues) or
          [cendor-sdk](https://github.com/cendorhq/cendor-sdk/issues) — but if you are unsure, file
          here and we will route it.
  - type: input
    id: recipe
    attributes:
      label: Which recipe?
      description: The folder path, please — those names are an API the cendor.ai /cookbook page deep-links to.
      placeholder: recipes/governance/pii-guardrail
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - quickstarts
        - providers
        - governance
        - frameworks
        - bridges
        - agents
        - observability
        - testing
        - sdk
        - apps (chat-playground)
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Python (uv)
        - TypeScript (npm — core-js, governed-agent-js, m365-custom-engine-js)
    validations:
      required: true
  - type: dropdown
    id: group
    attributes:
      label: Which dependency-group did you install?
      description: Framework/host SDKs live in per-category groups so one framework's breaking release cannot turn the whole repo red. Plain `uv sync` (no group) is right for quickstarts, providers, governance, testing, and sdk.
      options:
        - None — plain `uv sync`
        - frameworks-langchain
        - frameworks-agents
        - frameworks-mcp
        - frameworks-claude-agent
        - frameworks-llamaindex
        - frameworks-otel
        - observability-otel
        - agents-m365
        - apps
        - dev
        - "N/A — TypeScript recipe (`npm install`)"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: The exact command you ran
      placeholder: uv run --group frameworks-langchain python recipes/frameworks/langchain/main.py
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Python or Node version, and OS
      description: The Python jobs run 3.11 and 3.13; the TypeScript ones run Node 20 and 22.
      placeholder: Python 3.13.2, uv 0.9.4, Windows 11
    validations:
      required: true
  - type: input
    id: resolved
    attributes:
      label: Which cendor versions resolved?
      description: Recipes pin *ranges* that re-resolve on every run, so a fresh library release can change behavior. `uv pip list | grep cendor`, or `npm ls @cendor/core` in the recipe folder.
      placeholder: cendor-core 1.14.1, cendor-guardrails 1.4.0, cendor-sdk 1.19.0
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect (the README's expected-output "money shot"), and what happened instead?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: The full output
      description: Everything the command printed, including the traceback or the resolver error.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I ran it with **no API key set** in the environment — that is the supported path, and needing a key is itself a bug.
        - label: I ran the command from the repository root, as the recipe's README shows.
        - label: This is not a security vulnerability (those go through private reporting, linked above).
