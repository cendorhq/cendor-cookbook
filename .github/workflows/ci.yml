name: CI

# Every job runs the recipes OFFLINE against the shipped PyPI packages. There are NO secrets
# configured in this repo — a recipe that needs a key to go green does not belong here.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly re-resolve within the pyproject bounds, to catch dependency drift (new cendor 1.x,
  # new framework releases) before users do.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  quickstarts:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }}
      - name: run every quickstart offline
        run: |
          for f in recipes/quickstarts/*/main.py; do
            echo "::group::$f"; uv run --python ${{ matrix.python }} python "$f"; echo "::endgroup::"
          done

  providers:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }}
      - name: run every provider recipe offline
        run: |
          for f in recipes/providers/*/main.py; do
            echo "::group::$f"; uv run --python ${{ matrix.python }} python "$f"; echo "::endgroup::"
          done

  frameworks:
    # One matrix entry per framework, each installing ONLY its own dependency-group, so a
    # breaking release in one framework turns just its cell red — never the whole matrix.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        framework:
          - { name: langchain, group: frameworks-langchain }
          - { name: openai-agents-sdk, group: frameworks-agents }
          - { name: llamaindex, group: frameworks-llamaindex }
          - { name: azure-foundry-otel, group: frameworks-otel }
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: run ${{ matrix.framework.name }} recipe offline
        # `uv run --group` installs ONLY this framework's SDK group (+ base), keeping frameworks
        # isolated — a break in one framework's release turns just this cell red.
        run: |
          dir="recipes/frameworks/${{ matrix.framework.name }}"
          for f in "$dir"/*.py; do
            echo "::group::$f"
            uv run --python ${{ matrix.python }} --group ${{ matrix.framework.group }} python "$f"
            echo "::endgroup::"
          done

  bridges:
    # Framework-BRIDGE recipes (recipes/bridges/): a cendor Guardrail exposed inside another
    # framework's own guardrail/hook seam. Same isolation rule as `frameworks` above — one matrix
    # entry per bridge installing ONLY that bridge's dependency-group, so a breaking release in one
    # framework turns just its cell red. Fully offline: each recipe exercises the bridge seam
    # directly (no agent run, no model, no key, no network).
    #
    # This job was MISSING until 2026-07-28: four recipes shipped with a README promising "runs
    # green offline" that CI had never once executed. Every recipe directory under recipes/ must be
    # reachable from some job here — that is what the README's headline claim rests on.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        bridge:
          - { name: openai-agents-guardrail, group: frameworks-agents }
          - { name: claude-agent-pretooluse, group: frameworks-claude-agent }
          - { name: mcp-tool-gating, group: frameworks-mcp }
          - { name: langchain-middleware, group: frameworks-langchain }
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: run the ${{ matrix.bridge.name }} bridge offline
        run: |
          dir="recipes/bridges/${{ matrix.bridge.name }}"
          for f in "$dir"/*.py; do
            echo "::group::$f"
            uv run --python ${{ matrix.python }} --group ${{ matrix.bridge.group }} python "$f"
            echo "::endgroup::"
          done

  observability:
    # Observability recipes export Cendor's governance to an OTel backend. Each installs only its own
    # group; in-memory OTel readers keep them offline (no collector, no account).
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        recipe:
          - { name: otel-export, group: observability-otel }
          - { name: batch-ingest, group: observability-otel }
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: run ${{ matrix.recipe.name }} recipe offline
        run: |
          dir="recipes/observability/${{ matrix.recipe.name }}"
          for f in "$dir"/*.py; do
            echo "::group::$f"
            uv run --python ${{ matrix.python }} --group ${{ matrix.recipe.group }} python "$f"
            echo "::endgroup::"
          done

  agents:
    # Agent-host recipes (recipes/agents/): the agent runs inside somebody else's HOST process, so the
    # host SDK is the dependency and gets its own group — a breaking Microsoft 365 Agents SDK release
    # turns only this cell red. Still fully offline: a real AgentApplication on a real localhost socket,
    # driven by a local channel stub, with a fake provider client. No key, no network.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: run the M365 custom engine agent recipe offline
        run: |
          uv run --python ${{ matrix.python }} --group agents-m365 \
            python recipes/agents/m365-custom-engine-py/main.py
      - name: pytest the agents recipes
        run: |
          uv run --python ${{ matrix.python }} --group agents-m365 \
            pytest recipes/agents

  testing:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }}
      - name: pytest the cassette suite under xdist (0 API calls)
        run: uv run --python ${{ matrix.python }} pytest recipes/testing -n auto

  governance:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }}
      # A LOOP, not a list of names. This step used to run eu-ai-act-evidence/main.py alone and lean
      # on `pytest recipes/governance` for the rest — but guardrails-policy and guardrails-redteam
      # ship no test_*.py, so their main.py was never executed by CI at all (fixed 2026-07-28). The
      # loop cannot rot the same way: a new governance recipe is covered the moment it lands.
      - name: run every governance recipe offline
        run: |
          for f in recipes/governance/*/main.py; do
            echo "::group::$f"; uv run --python ${{ matrix.python }} python "$f"; echo "::endgroup::"
          done
      - name: pytest the governance recipes that ship a test file
        run: uv run --python ${{ matrix.python }} pytest recipes/governance

  sdk:
    # The cendor-sdk recipes (recipes/sdk/) — a governed agent, offline against a stub client.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }}
      - name: run every SDK recipe offline
        run: |
          for f in recipes/sdk/*/main.py; do
            echo "::group::$f"; uv run --python ${{ matrix.python }} python "$f"; echo "::endgroup::"
          done
      - name: pytest the SDK recipes
        run: uv run --python ${{ matrix.python }} pytest recipes/sdk

  apps:
    # The chat-playground app. Installs ONLY the `apps` group (gradio + provider SDKs) so a Gradio
    # breaking release turns just this cell red — never the recipes' jobs. Smoke-tests that the app
    # imports and the theme constructs, then runs the offline plumbing tests (no UI e2e, no server).
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: import app + construct theme (smoke)
        run: |
          uv run --python ${{ matrix.python }} --group apps python -c "
          import sys; sys.path.insert(0, 'recipes/apps/chat-playground')
          import theme; assert theme.CendorTheme()
          import app; assert app.build_demo()
          print('apps smoke OK')"
      - name: offline plumbing tests
        run: uv run --python ${{ matrix.python }} --group apps pytest recipes/apps/chat-playground

  js-recipes:
    # The TypeScript recipes (core-js, governed-agent-js, m365-custom-engine-js). Each installs the
    # published @cendor/* packages and runs offline against a fake client — no key, no network.
    # NOTE: a caret pin resolves only within its major, so a stale pin here rots SILENTLY GREEN —
    # after any @cendor/core or @cendor/sdk minor, bump the pins in all three recipes' package.json
    # (the whole @cendor/* set together, never core alone — see GATE G1 at the end of this job).
    # Node 20 and 22 are in the matrix on purpose: the M365 recipe's turn scope uses
    # AsyncLocalStorage, and `run()` vs `enterWith` behaves differently on legacy-ALS Node — a test
    # green only on Node 24 proves nothing about the LTS.
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: run every TypeScript recipe offline
        run: |
          for dir in recipes/quickstarts/core-js recipes/sdk/governed-agent-js \
                     recipes/agents/m365-custom-engine-js; do
            echo "::group::$dir"
            (cd "$dir" && npm install && node index.mjs)
            echo "::endgroup::"
          done
      # GATE G1 — exactly one @cendor/core per recipe. A stale pin here used to rot silently green
      # (the recipe still runs; it just runs on an old shelf). Two cores = two event buses = a
      # guardrail decision that never reaches the SDK, with nothing failing to say so.
      - name: G1 — one @cendor/core per recipe
        run: |
          node scripts/check-one-core.mjs recipes/quickstarts/core-js \
            recipes/sdk/governed-agent-js recipes/agents/m365-custom-engine-js
