name: CI

# Every job runs the recipes OFFLINE against the shipped PyPI packages. There are NO secrets
# configured in this repo — a recipe that needs a key to go green does not belong here.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly re-resolve within the pyproject bounds, to catch dependency drift (new cendor 1.x,
  # new framework releases) before users do.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # A recipe that PRINTS a character cp1252 cannot encode dies on a Windows console. Every job
      # in this file is ubuntu-latest, so the matrix structurally cannot see that class — which is
      # exactly why it is a static check. It found a live offender the day it was written
      # (agents/m365-custom-engine-py printed a ⚠️ in its vacuous-replay branch).
      # ⚠️ It does NOT claim the recipes run on Windows; it checks printed string literals only.
      - run: uv run python scripts/check_print_encoding.py
      # The README's recipe TABLE is gated (by the site's card check, against both trees); the
      # SENTENCES stating totals were not, and had drifted two numbers behind on 2026-08-03.
      #
      # ⚠️ The parity leg needs the TypeScript tree, and WITHOUT IT THE LEG SKIPS while the gate
      # still prints PASS — which would gate the notebook count and not the parity sentence, i.e.
      # not the number that actually drifted. The first CI run of this gate did exactly that.
      # `actions/checkout` refuses a `path:` outside the workspace, so the sibling cannot go at
      # `../cendor-cookbook-js`; it is cloned in-workspace and pointed at by COOKBOOK_JS_PATH.
      # Public repo, so no token. `fetch-depth: 1` + `sparse-checkout` keeps it cheap.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cendorhq/cendor-cookbook-js
          path: .cookbook-js
          fetch-depth: 1
          sparse-checkout: recipes
      - run: uv run python scripts/check_readme_counts.py
        env:
          COOKBOOK_JS_PATH: .cookbook-js/recipes

  quickstarts:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }}
      - name: run every quickstart offline
        run: |
          for f in recipes/quickstarts/*/main.py; do
            echo "::group::$f"; uv run --python ${{ matrix.python }} python "$f"; echo "::endgroup::"
          done

  providers:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }}
      - name: run every provider recipe offline
        run: |
          for f in recipes/providers/*/main.py; do
            echo "::group::$f"; uv run --python ${{ matrix.python }} python "$f"; echo "::endgroup::"
          done

  frameworks:
    # One matrix entry per framework, each installing ONLY its own dependency-group, so a
    # breaking release in one framework turns just its cell red — never the whole matrix.
    #
    # ⚠️ THIS MATRIX ENUMERATES. A new recipe under `recipes/frameworks/` is NOT covered until it has
    # a row here, and nothing will remind you — unlike `quickstarts`/`providers`/`libs`, which loop
    # over their directory. `azure-foundry-otel-export` was added on 2026-08-02 and needed this line.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        framework:
          - { name: langchain, group: frameworks-langchain }
          - { name: openai-agents-sdk, group: frameworks-agents }
          - { name: llamaindex, group: frameworks-llamaindex }
          - { name: azure-foundry-otel, group: frameworks-otel }
          - { name: azure-foundry-otel-export, group: frameworks-otel }
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: run ${{ matrix.framework.name }} recipe offline
        # `uv run --group` installs ONLY this framework's SDK group (+ base), keeping frameworks
        # isolated — a break in one framework's release turns just this cell red.
        run: |
          dir="recipes/frameworks/${{ matrix.framework.name }}"
          for f in "$dir"/*.py; do
            echo "::group::$f"
            uv run --python ${{ matrix.python }} --group ${{ matrix.framework.group }} python "$f"
            echo "::endgroup::"
          done

  bridges:
    # Framework-BRIDGE recipes (recipes/bridges/): a cendor Guardrail exposed inside another
    # framework's own guardrail/hook seam. Same isolation rule as `frameworks` above — one matrix
    # entry per bridge installing ONLY that bridge's dependency-group, so a breaking release in one
    # framework turns just its cell red. Fully offline: each recipe exercises the bridge seam
    # directly (no agent run, no model, no key, no network).
    #
    # This job was MISSING until 2026-07-28: four recipes shipped with a README promising "runs
    # green offline" that CI had never once executed. Every recipe directory under recipes/ must be
    # reachable from some job here — that is what the README's headline claim rests on.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        bridge:
          - { name: openai-agents-guardrail, group: frameworks-agents }
          - { name: claude-agent-pretooluse, group: frameworks-claude-agent }
          - { name: mcp-tool-gating, group: frameworks-mcp }
          - { name: langchain-middleware, group: frameworks-langchain }
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: run the ${{ matrix.bridge.name }} bridge offline
        run: |
          dir="recipes/bridges/${{ matrix.bridge.name }}"
          for f in "$dir"/*.py; do
            echo "::group::$f"
            uv run --python ${{ matrix.python }} --group ${{ matrix.bridge.group }} python "$f"
            echo "::endgroup::"
          done

  observability:
    # Observability recipes export Cendor's governance to an OTel backend. Each installs only its own
    # group; in-memory OTel readers keep them offline (no collector, no account).
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        recipe:
          - { name: otel-export, group: observability-otel }
          - { name: batch-ingest, group: observability-otel }
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: run ${{ matrix.recipe.name }} recipe offline
        run: |
          dir="recipes/observability/${{ matrix.recipe.name }}"
          for f in "$dir"/*.py; do
            echo "::group::$f"
            uv run --python ${{ matrix.python }} --group ${{ matrix.recipe.group }} python "$f"
            echo "::endgroup::"
          done

  agents:
    # Agent-host recipes (recipes/agents/): the agent runs inside somebody else's HOST process, so the
    # host SDK is the dependency and gets its own group — a breaking Microsoft 365 Agents SDK release
    # turns only this cell red. Still fully offline: a real AgentApplication on a real localhost socket,
    # driven by a local channel stub, with a fake provider client. No key, no network.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: run the M365 custom engine agent recipe offline
        run: |
          uv run --python ${{ matrix.python }} --group agents-m365 \
            python recipes/agents/m365-custom-engine-py/main.py
      # "Does it run in the M365 Agents Playground?" was a question only a human with a browser
      # could answer, so a broken run instruction sat in the README unnoticed until 2026-08-01.
      # This drives the two Activities the Playground sends (conversationUpdate, then message)
      # against the real endpoint and asserts a governed reply with its envelope.
      - name: the Playground-shaped smoke
        run: |
          uv run --python ${{ matrix.python }} --group agents-m365 \
            python recipes/agents/m365-custom-engine-py/smoke.py
      - name: pytest the agents recipes
        run: |
          uv run --python ${{ matrix.python }} --group agents-m365 \
            pytest recipes/agents

  testing:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }}
      - name: pytest the cassette suite under xdist (0 API calls)
        run: uv run --python ${{ matrix.python }} pytest recipes/testing -n auto

  governance:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }}
      # A LOOP, not a list of names. This step used to run eu-ai-act-evidence/main.py alone and lean
      # on `pytest recipes/governance` for the rest — but guardrails-policy and guardrails-redteam
      # ship no test_*.py, so their main.py was never executed by CI at all (fixed 2026-07-28). The
      # loop cannot rot the same way: a new governance recipe is covered the moment it lands.
      - name: run every governance recipe offline
        run: |
          for f in recipes/governance/*/main.py; do
            echo "::group::$f"; uv run --python ${{ matrix.python }} python "$f"; echo "::endgroup::"
          done
      - name: pytest the governance recipes that ship a test file
        run: uv run --python ${{ matrix.python }} pytest recipes/governance

  sdk:
    # The cendor-sdk recipes (recipes/sdk/) — a governed agent, offline against a stub client.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }}
      - name: run every SDK recipe offline
        run: |
          for f in recipes/sdk/*/main.py; do
            echo "::group::$f"; uv run --python ${{ matrix.python }} python "$f"; echo "::endgroup::"
          done
      - name: pytest the SDK recipes
        run: uv run --python ${{ matrix.python }} pytest recipes/sdk

  apps:
    # The chat-playground app. Installs ONLY the `apps` group (gradio + provider SDKs) so a Gradio
    # breaking release turns just this cell red — never the recipes' jobs.
    #
    # The app was split into modules on 2026-08-01 (config · session · engine · panels · ui, with a
    # thin app.py). Two smoke steps rather than one, because they fail differently:
    #   * the ENGINE step imports the pipeline with NO gradio installed. It is the gate on the whole
    #     point of the split — if someone re-couples the turn logic to the UI, the base env cannot
    #     import it and this step goes red while the Blocks step below stays green.
    #   * the UI step constructs the real Blocks, which is what the devcontainer's auto-start does.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }}
      - name: the engine imports and runs a turn with gradio UNIMPORTABLE
        # `find_spec('gradio') is None` would be a check that only works when the base env happens
        # not to carry gradio — green for the wrong reason on a developer machine that ran
        # `uv sync --group apps` earlier. Blocking the import outright is the same assertion with
        # no dependency on what is installed, and it fails loudly the moment engine/panels reach
        # for the UI.
        run: |
          uv run --python ${{ matrix.python }} python -c "
          import sys; sys.path.insert(0, 'recipes/apps/chat-playground')
          class NoGradio:
              def find_module(self, name, path=None): return self.find_spec(name, path)
              def find_spec(self, name, path=None, target=None):
                  if name == 'gradio' or name.startswith('gradio.'):
                      raise ImportError('gradio is deliberately unimportable in this step')
                  return None
          sys.meta_path.insert(0, NoGradio())
          try:
              import gradio  # noqa: F401
          except ImportError:
              pass
          else:
              raise SystemExit('the import block did not work — this step would prove nothing')
          import engine, config, session as s
          sess = s.new_session()
          det = engine.detect(sess, 'I was double charged')
          r = engine.run_turn(sess, 'I was double charged', det['safe_text'], 'Demo', 'OpenAI', '', 0.5, 'block')
          assert r['reply'], 'the offline turn produced no reply'
          assert sess.events and sess.events[-1]['cost'] != '0', 'the turn was not priced'
          import panels; assert 'hash-chain entries' in panels.audit_panel(sess)
          print('engine smoke OK (gradio blocked):', sess.events[-1])"
      - name: build the real Blocks (what the devcontainer auto-starts)
        run: |
          uv run --python ${{ matrix.python }} --group apps python -c "
          import sys; sys.path.insert(0, 'recipes/apps/chat-playground')
          import theme; assert theme.CendorTheme()
          import app; assert app.build_demo()
          print('apps smoke OK')"
      - name: offline plumbing tests
        run: uv run --python ${{ matrix.python }} --group apps pytest recipes/apps/chat-playground

  # NOTE — the TypeScript recipes moved out on 2026-07-31. They live in
  # https://github.com/cendorhq/cendor-cookbook-js with their own CI (same node 20 + 22 matrix,
  # per-recipe npm install, one-core gate). This repo is Python-only, and there is deliberately no
  # `js-recipes` job left here: one toolchain per repo is the whole point of the split.

  combos:
    # The cross-library COOPERATION recipes (recipes/combos/). Each wires two or three libraries
    # together through core's bus/interceptor/protocol seams and ends in a real assertion — a
    # verify() that returns True, a byte-identical restore, an identical replay — never a printed
    # claim. Base install; offline and keyless like everything else here.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }}
      - name: run every combo recipe offline
        run: |
          for f in recipes/combos/*/main.py; do
            echo "::group::$f"; uv run --python ${{ matrix.python }} python "$f"; echo "::endgroup::"
          done

  notebooks:
    # The 20 curated notebooks (quickstarts ×7, providers ×7, combos ×6) are EXECUTED, not just
    # linted: `pytest --nbmake` starts a kernel and runs every cell top to bottom, failing on the
    # first exception. A notebook that is only ever read rots into a screenshot of code that used
    # to work; this is what stops that. Each one's final cell asserts what its `main.py` asserts,
    # so a library change that breaks one breaks both.
    #
    # Negative control run before this job was trusted (2026-08-01): an `assert False` planted in
    # one cell exited 1 and named the cell; reverting it went back to green.
    #
    # `--group providers` is here for the gemini/bedrock/ollama notebooks' imports; `--group apps`
    # is NOT needed — no notebook touches the playground.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }} --group dev --group providers
      - name: execute every notebook
        run: |
          uv run --python ${{ matrix.python }} --group dev --group providers \
            pytest --nbmake --nbmake-timeout=300 -n auto \
            recipes/quickstarts recipes/providers recipes/combos

  libs:
    # Per-library DEPTH recipes (recipes/libs/). Same loop shape as every other category job — a new
    # recipe is covered the moment it lands, which is the property that stops a README promising
    # "runs green offline" for something CI never executed.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --python ${{ matrix.python }}
      - name: run every per-library depth recipe offline
        run: |
          for f in recipes/libs/*/main.py; do
            echo "::group::$f"; uv run --python ${{ matrix.python }} python "$f"; echo "::endgroup::"
          done
