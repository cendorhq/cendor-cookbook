version: 2
updates:
  # Keep the CI GitHub Actions on current pinned versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies (base deps + every dependency-group in pyproject.toml).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # gradio 6 removed Chatbot(type=...) and breaks the chat-playground app; the gradio-6
      # migration is deliberately deferred — unignore when it lands.
      - dependency-name: gradio
        versions: [">=6.0.0, <7.0.0"]

  # The THREE TypeScript recipes — each pins the published @cendor/* packages directly, so keep them
  # current as new releases ship. This is the drift class that rots SILENTLY GREEN: a caret pin only
  # resolves within its major, so a stale pin keeps passing CI on an old shelf while the recipe stops
  # teaching what is published. `m365-custom-engine-js` carries seven @cendor/* pins of its own and
  # was unmanaged here until 2026-07-30 — the one set nothing was watching.
  - package-ecosystem: npm
    directory: /recipes/quickstarts/core-js
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: npm
    directory: /recipes/sdk/governed-agent-js
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: npm
    directory: /recipes/agents/m365-custom-engine-js
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
