version: 2
updates:
  # Keep the CI GitHub Actions on current pinned versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies (base deps + every dependency-group in pyproject.toml).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # gradio 6 removed Chatbot(type=...) and breaks the chat-playground app; the gradio-6
      # migration is deliberately deferred — unignore when it lands.
      - dependency-name: gradio
        versions: [">=6.0.0, <7.0.0"]

  # NOTE — there is no `npm` ecosystem entry here any more. The TypeScript recipes moved to
  # https://github.com/cendorhq/cendor-cookbook-js on 2026-07-31, and their npm pins are watched by
  # that repo's own dependabot.yml (one entry per recipe directory — nothing globs directories in
  # dependabot v2, so a new recipe there needs a new entry there).
