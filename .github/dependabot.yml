version: 2
updates:
  # Keep the CI GitHub Actions on current pinned versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies (base deps + every dependency-group in pyproject.toml).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # gradio 6 removed Chatbot(type=...) and breaks the chat-playground app; the gradio-6
      # migration is deliberately deferred — unignore when it lands.
      - dependency-name: gradio
        versions: [">=6.0.0, <7.0.0"]

  # The two TypeScript recipes — each pins the published @cendor/* packages, so keep them
  # current as new 0.x minors ship (this is the drift class that previously rotted silently).
  - package-ecosystem: npm
    directory: /recipes/quickstarts/core-js
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: npm
    directory: /recipes/sdk/governed-agent-js
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
