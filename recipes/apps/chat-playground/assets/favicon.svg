<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Cendor">
  <style>
    /* The SVG favicon follows the browser/OS colour scheme: dark tile + white mark
       in dark mode, light tile + navy mark in light mode. Hub stays blue in both.
       Base attributes are the dark theme, so PNG/.ico fallbacks rasterize dark. */
    @media (prefers-color-scheme: light) {
      .bg    { fill: #FFFFFF; }
      .lines { stroke: #0F172A; }
      .dots  { fill: #0F172A; }
    }
  </style>
  <rect class="bg" width="48" height="48" rx="10" fill="#0F172A"/>
  <g class="lines" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" fill="none">
    <line x1="24" y1="7" x2="24" y2="16"/><line x1="24" y1="32" x2="24" y2="41"/>
    <line x1="9.3" y1="15.5" x2="17" y2="20"/><line x1="31" y1="28" x2="38.7" y2="32.5"/>
    <line x1="9.3" y1="32.5" x2="17" y2="28"/><line x1="31" y1="20" x2="38.7" y2="15.5"/>
  </g>
  <g class="dots" fill="#FFFFFF">
    <circle cx="9.3" cy="15.5" r="2.6"/><circle cx="38.7" cy="32.5" r="2.6"/>
    <circle cx="9.3" cy="32.5" r="2.6"/><circle cx="38.7" cy="15.5" r="2.6"/>
  </g>
  <circle cx="24" cy="24" r="6" fill="#2563EB"/>
</svg>
